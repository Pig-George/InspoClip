<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InspoClip Popup UI Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbf6ed;
      --paper-strong: #fffdf8;
      --ink: #3f2b25;
      --muted: #8f786b;
      --line: #eadbc7;
      --line-strong: #ddc5a7;
      --brand: #b86f45;
      --brand-deep: #955233;
      --brand-soft: #f5e4d5;
      --success: #4d8b68;
      --shadow: 0 26px 70px rgba(72, 45, 34, 0.18), 0 4px 16px rgba(72, 45, 34, 0.08);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 12%, rgba(230, 201, 166, 0.42), transparent 28%),
        linear-gradient(145deg, #eee5d8, #e4d8ca);
      color: var(--ink);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .prototype-label {
      position: fixed;
      left: 22px;
      top: 18px;
      color: rgba(63, 43, 37, 0.55);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .popup {
      position: relative;
      width: 388px;
      height: 488px;
      overflow: hidden;
      border: 1px solid rgba(218, 196, 167, 0.9);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: var(--shadow);
      animation: popup-in 420ms cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes popup-in {
      from { opacity: 0; transform: translateY(10px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .topbar {
      height: 72px;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.82);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      box-shadow: 0 7px 15px rgba(184, 111, 69, 0.24);
      transform: rotate(-2deg);
    }

    .brand-mark svg { width: 21px; height: 21px; stroke-width: 1.8; }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: 15px; line-height: 1.2; letter-spacing: -0.01em; }
    .brand-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 10.5px; white-space: nowrap; }

    .top-actions { display: flex; align-items: center; gap: 5px; }

    .icon-button,
    .language-button {
      position: relative;
      width: 34px;
      height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #80685c;
      cursor: pointer;
      transition: 160ms ease;
    }

    .icon-button:hover,
    .language-button:hover { background: #f2e7d9; color: var(--brand-deep); }
    .icon-button:active,
    .language-button:active { transform: scale(.94); }
    .icon-button svg { width: 17px; height: 17px; stroke-width: 1.8; }
    .language-button { font-size: 11px; font-weight: 800; }

    .connection-dot {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 7px;
      height: 7px;
      border: 1.5px solid var(--paper-strong);
      border-radius: 999px;
      background: var(--success);
    }

    .main-shell {
      height: calc(100% - 72px);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .tabs {
      margin: 13px 16px 0;
      padding: 3px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      border-radius: 12px;
      background: #eee2d3;
    }

    .tab {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      transition: 180ms ease;
    }

    .tab svg { width: 15px; height: 15px; stroke-width: 1.9; }
    .tab.is-active { background: var(--paper-strong); color: var(--brand-deep); box-shadow: 0 2px 8px rgba(77, 49, 39, 0.08); }

    .content {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .view {
      position: absolute;
      inset: 0;
      padding: 16px;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transform: translateX(12px);
      transition: opacity 180ms ease, transform 220ms ease;
      scrollbar-width: thin;
      scrollbar-color: #d8c2a8 transparent;
    }

    .view.is-active { opacity: 1; pointer-events: auto; transform: translateX(0); }

    .context-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .eyebrow { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; }
    .site-chip { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #7b6559; font-size: 10px; }

    .primary-action,
    .open-app,
    .choose-button,
    .save-settings {
      width: 100%;
      border: 0;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .analysis-control {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 48px;
      border-radius: 14px;
      background: var(--brand);
      box-shadow: 0 10px 22px rgba(184, 111, 69, 0.23);
      transition: transform 150ms ease, box-shadow 180ms ease;
    }

    .analysis-control:hover {
      transform: translateY(-1px);
      box-shadow: 0 13px 25px rgba(184, 111, 69, 0.27);
    }

    .analysis-control:focus-within { box-shadow: 0 0 0 3px rgba(184, 111, 69, .16), 0 13px 25px rgba(184, 111, 69, 0.27); }

    .primary-action {
      min-height: 55px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-radius: 14px 0 0 14px;
      background: transparent;
      color: #fff;
      text-align: left;
      box-shadow: none;
    }

    .primary-action:hover { background: rgba(126, 63, 33, .12); }
    .primary-action:active { background: rgba(126, 63, 33, .2); }
    .primary-action svg { width: 20px; height: 20px; stroke-width: 1.9; }
    .primary-action strong { display: block; font-size: 13px; }
    .primary-action span { display: block; margin-top: 2px; color: rgba(255,255,255,.76); font-size: 9.5px; }
    .analysis-menu-trigger {
      position: relative;
      min-width: 48px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-left: 1px solid rgba(255, 255, 255, .24);
      border-radius: 0 14px 14px 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .analysis-menu-trigger:hover,
    .analysis-menu-trigger[aria-expanded="true"] { background: rgba(126, 63, 33, .18); }
    .analysis-menu-trigger svg { width: 17px; height: 17px; transition: transform 180ms ease; }
    .analysis-menu-trigger[aria-expanded="true"] svg { transform: rotate(180deg); }

    .analysis-menu {
      position: absolute;
      z-index: 10;
      right: 0;
      top: calc(100% + 8px);
      width: 208px;
      padding: 5px;
      border: 1px solid var(--line-strong);
      border-radius: 13px;
      background: rgba(255, 253, 248, .98);
      box-shadow: 0 15px 35px rgba(63, 43, 37, .16);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-5px) scale(.97);
      transform-origin: top right;
      transition: opacity 150ms ease, transform 180ms ease;
    }

    .analysis-menu.is-open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

    .analysis-option {
      width: 100%;
      min-height: 48px;
      padding: 7px 9px;
      display: grid;
      grid-template-columns: 29px 1fr 16px;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .analysis-option:hover { background: #f5eadc; }
    .analysis-option .option-icon { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 8px; background: #f2e5d5; color: var(--brand-deep); }
    .analysis-option svg { width: 15px; height: 15px; }
    .analysis-option strong { display: block; font-size: 10.5px; }
    .analysis-option span span { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }
    .analysis-option .option-check { opacity: 0; color: var(--brand-deep); }
    .analysis-option.is-selected .option-check { opacity: 1; }

    .shortcut-hint {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #a08b7f;
      font-size: 9.5px;
    }

    kbd {
      padding: 2px 5px;
      border: 1px solid #ddcdbb;
      border-bottom-width: 2px;
      border-radius: 5px;
      background: #fffdf8;
      color: #776157;
      font: 8.5px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .asset-heading { margin-bottom: 12px; }
    .asset-heading h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
    .asset-heading p { margin: 4px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.5; }

    .dropzone {
      min-height: 150px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1.5px dashed #d7b38f;
      border-radius: 16px;
      background: rgba(255, 253, 248, 0.68);
      text-align: center;
      cursor: pointer;
      transition: 180ms ease;
    }

    .dropzone:hover { border-color: var(--brand); background: #fffaf3; box-shadow: inset 0 0 0 4px rgba(184, 111, 69, 0.05); }

    .drop-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin-bottom: 10px;
      border-radius: 14px;
      background: var(--brand-soft);
      color: var(--brand-deep);
    }

    .drop-icon svg { width: 23px; height: 23px; stroke-width: 1.7; }
    .dropzone strong { font-size: 12.5px; }
    .dropzone > span { margin-top: 4px; color: var(--muted); font-size: 9.5px; }

    .choose-button {
      width: auto;
      margin-top: 12px;
      padding: 7px 13px;
      border-radius: 9px;
      background: var(--brand);
      color: #fff;
      font-size: 10.5px;
      font-weight: 750;
    }

    .asset-note { margin: 8px 0 0; text-align: center; color: #9b867a; font-size: 9.5px; }

    .url-disclosure {
      width: 100%;
      min-height: 39px;
      margin-top: 12px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: transparent;
      color: #725d52;
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 700;
    }

    .url-disclosure svg { width: 14px; height: 14px; }
    .url-disclosure .chevron { margin-left: auto; transition: transform 180ms ease; }
    .url-disclosure.is-open .chevron { transform: rotate(180deg); }

    .url-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 220ms ease;
    }
    .url-panel.is-open { grid-template-rows: 1fr; }
    .url-panel-inner { min-height: 0; overflow: hidden; }
    .url-form { padding-top: 8px; display: flex; gap: 7px; }
    .url-form input {
      min-width: 0;
      flex: 1;
      padding: 8px 9px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: #fffdf8;
      color: var(--ink);
      outline: none;
      font-size: 10px;
    }
    .url-form input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(184, 111, 69, .1); }
    .url-form button { padding: 0 12px; border: 0; border-radius: 9px; background: #ead8c2; color: #684f43; font-size: 10px; font-weight: 750; cursor: pointer; }

    .footer {
      padding: 10px 16px 14px;
      border-top: 1px solid var(--line);
      background: rgba(251, 246, 237, 0.9);
    }

    .open-app {
      min-height: 37px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 11px;
      background: transparent;
      color: var(--brand-deep);
      font-size: 11px;
      font-weight: 800;
    }

    .open-app:hover { background: #f0e3d3; }
    .open-app svg { width: 14px; height: 14px; }

    .settings-view {
      position: absolute;
      inset: 72px 0 0;
      z-index: 8;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--paper);
      opacity: 0;
      pointer-events: none;
      transform: translateX(100%);
      transition: transform 260ms cubic-bezier(.2,.75,.25,1), opacity 180ms ease;
    }
    .settings-view.is-open { opacity: 1; pointer-events: auto; transform: translateX(0); }

    .settings-header { padding: 13px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
    .settings-header .icon-button { width: 30px; height: 30px; }
    .settings-header strong { font-size: 13px; }
    .settings-header span { display: block; margin-top: 2px; color: var(--muted); font-size: 9.5px; }

    .settings-content { min-height: 0; overflow-y: auto; padding: 14px 16px; }
    .settings-card { padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,253,248,.72); }
    .settings-card + .settings-card { margin-top: 10px; }
    .settings-card h3 { margin: 0 0 10px; display: flex; align-items: center; gap: 7px; font-size: 11.5px; }
    .settings-card h3 svg { width: 14px; height: 14px; color: var(--brand-deep); }
    .field + .field { margin-top: 10px; }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 9.5px; font-weight: 700; }
    .field input { width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; background: #fffdf8; color: var(--ink); outline: none; font-size: 10px; }
    .shortcut-field { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .shortcut-field + .shortcut-field { margin-top: 8px; }
    .shortcut-field span { color: #6f594d; font-size: 10px; }
    .shortcut-field kbd { min-width: 91px; padding: 5px 8px; text-align: center; }
    .settings-footer { padding: 11px 16px 14px; border-top: 1px solid var(--line); }
    .save-settings { min-height: 40px; border-radius: 11px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 800; }
    .save-settings:hover { background: var(--brand-deep); }

    .toast {
      position: absolute;
      z-index: 20;
      left: 50%;
      top: 80px;
      min-width: 230px;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #d5c3ae;
      border-radius: 12px;
      background: rgba(63, 43, 37, 0.94);
      box-shadow: 0 12px 28px rgba(42, 27, 22, .2);
      color: #fffaf2;
      font-size: 10.5px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -8px) scale(.96);
      transition: 200ms ease;
    }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0) scale(1); }
    .toast svg { width: 14px; height: 14px; color: #9bd4ad; }

    :focus-visible { outline: 2px solid rgba(184, 111, 69, .7); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <div class="prototype-label">Interactive prototype · 390 × 488</div>

  <main class="popup" aria-label="InspoClip popup prototype">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="sparkles"></i></div>
        <div class="brand-copy">
          <strong>InspoClip</strong>
          <span>捕捉并拆解设计灵感</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" type="button" title="服务已连接" aria-label="测试服务连接">
          <i data-lucide="radio-tower"></i><span class="connection-dot"></span>
        </button>
        <button class="language-button" type="button" title="切换语言" aria-label="切换语言">中</button>
        <button class="icon-button" id="open-settings" type="button" title="设置" aria-label="打开设置">
          <i data-lucide="settings-2"></i>
        </button>
      </div>
    </header>

    <div class="main-shell">
      <nav class="tabs" aria-label="主要功能">
        <button class="tab is-active" type="button" data-tab="page"><i data-lucide="scan-line"></i>页面操作</button>
        <button class="tab" type="button" data-tab="asset"><i data-lucide="image-play"></i>素材分析</button>
      </nav>

      <div class="content">
        <section class="view is-active" data-view="page">
          <div class="context-row">
            <span class="eyebrow">当前页面</span>
            <span class="site-chip">dribbble.com/shots/interaction</span>
          </div>

          <div class="analysis-control">
            <button class="primary-action" id="analyze-button" type="button">
              <i data-lucide="wand-sparkles"></i>
              <span><strong data-action-label>分析当前区域</strong><span data-action-hint>框选后选择截图或录屏</span></span>
            </button>
            <button class="analysis-menu-trigger" id="analysis-menu-trigger" type="button" aria-label="选择分析范围" aria-expanded="false">
              <i data-lucide="chevron-down"></i>
            </button>
            <div class="analysis-menu" id="analysis-menu" role="menu">
              <button class="analysis-option is-selected" type="button" data-scope="area" role="menuitemradio" aria-checked="true">
                <span class="option-icon"><i data-lucide="scan"></i></span>
                <span><strong>区域框选</strong><span>截图或录屏</span></span>
                <i class="option-check" data-lucide="check"></i>
              </button>
              <button class="analysis-option" type="button" data-scope="page" role="menuitemradio" aria-checked="false">
                <span class="option-icon"><i data-lucide="panels-top-left"></i></span>
                <span><strong>完整页面</strong><span>分析整页内容</span></span>
                <i class="option-check" data-lucide="check"></i>
              </button>
            </div>
          </div>
          <div class="shortcut-hint"><kbd>Ctrl</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>A</kbd><span>快速启动区域分析</span></div>
        </section>

        <section class="view" data-view="asset">
          <div class="asset-heading">
            <h2>分析图片或视频</h2>
            <p>粘贴、拖拽或选择素材，结果会在当前网页右侧打开。</p>
          </div>
          <div class="dropzone" id="dropzone" role="button" tabindex="0">
            <span class="drop-icon"><i data-lucide="images"></i></span>
            <strong>把素材放到这里</strong>
            <span>图片 · MP4 · MOV · WebM</span>
            <button class="choose-button" type="button">选择素材</button>
          </div>
          <p class="asset-note">也可以直接按 Ctrl + V 粘贴剪贴板素材</p>

          <button class="url-disclosure" id="url-disclosure" type="button" aria-expanded="false">
            <i data-lucide="link-2"></i>通过公开视频链接分析<i class="chevron" data-lucide="chevron-down"></i>
          </button>
          <div class="url-panel" id="url-panel">
            <div class="url-panel-inner">
              <div class="url-form">
                <input type="url" placeholder="https://example.com/demo.mp4" aria-label="公开视频链接" />
                <button type="button" id="url-analyze">分析</button>
              </div>
            </div>
          </div>
        </section>
      </div>

      <footer class="footer">
        <button class="open-app" type="button"><i data-lucide="external-link"></i>打开 InspoClip 工作台</button>
      </footer>
    </div>

    <section class="settings-view" id="settings-view" aria-hidden="true">
      <div class="settings-header">
        <button class="icon-button" id="close-settings" type="button" aria-label="返回"><i data-lucide="arrow-left"></i></button>
        <div><strong>设置</strong><span>连接地址与快捷键</span></div>
      </div>
      <div class="settings-content">
        <div class="settings-card">
          <h3><i data-lucide="server"></i>服务连接</h3>
          <div class="field"><label for="server-url">Server URL</label><input id="server-url" value="http://localhost:3001" /></div>
          <div class="field"><label for="app-url">Frontend URL</label><input id="app-url" value="http://localhost:8080" /></div>
        </div>
        <div class="settings-card">
          <h3><i data-lucide="command"></i>快捷键</h3>
          <div class="shortcut-field"><span>区域分析</span><kbd>Ctrl + Shift + A</kbd></div>
          <div class="shortcut-field"><span>区域保存</span><kbd>Ctrl + Shift + S</kbd></div>
        </div>
      </div>
      <div class="settings-footer"><button class="save-settings" id="save-settings" type="button">保存设置</button></div>
    </section>

    <div class="toast" id="toast" role="status"><i data-lucide="circle-check"></i><span>已启动区域选择</span></div>
  </main>

  <script src="../../extension/node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    const tabs = document.querySelectorAll('[data-tab]');
    const views = document.querySelectorAll('[data-view]');
    tabs.forEach((tab) => tab.addEventListener('click', () => {
      tabs.forEach((item) => item.classList.toggle('is-active', item === tab));
      views.forEach((view) => view.classList.toggle('is-active', view.dataset.view === tab.dataset.tab));
    }));

    const analysisMenuTrigger = document.getElementById('analysis-menu-trigger');
    const analysisMenu = document.getElementById('analysis-menu');
    const scopes = document.querySelectorAll('.analysis-option[data-scope]');
    const actionLabel = document.querySelector('[data-action-label]');
    const actionHint = document.querySelector('[data-action-hint]');
    let selectedScope = 'area';
    const setAnalysisMenuOpen = (open) => {
      analysisMenu.classList.toggle('is-open', open);
      analysisMenuTrigger.setAttribute('aria-expanded', String(open));
    };
    analysisMenuTrigger.addEventListener('click', (event) => {
      event.stopPropagation();
      setAnalysisMenuOpen(!analysisMenu.classList.contains('is-open'));
    });
    scopes.forEach((scope) => scope.addEventListener('click', () => {
      selectedScope = scope.dataset.scope;
      scopes.forEach((item) => {
        const selected = item === scope;
        item.classList.toggle('is-selected', selected);
        item.setAttribute('aria-checked', String(selected));
      });
      const isArea = scope.dataset.scope === 'area';
      actionLabel.textContent = isArea ? '分析当前区域' : '分析完整页面';
      actionHint.textContent = isArea ? '框选后选择截图或录屏' : '理解当前页面的完整视觉内容';
      setAnalysisMenuOpen(false);
    }));
    document.addEventListener('click', (event) => {
      if (!analysisMenu.contains(event.target) && event.target !== analysisMenuTrigger) setAnalysisMenuOpen(false);
    });

    const settingsView = document.getElementById('settings-view');
    document.getElementById('open-settings').addEventListener('click', () => {
      settingsView.classList.add('is-open');
      settingsView.setAttribute('aria-hidden', 'false');
    });
    document.getElementById('close-settings').addEventListener('click', () => {
      settingsView.classList.remove('is-open');
      settingsView.setAttribute('aria-hidden', 'true');
    });

    const urlDisclosure = document.getElementById('url-disclosure');
    const urlPanel = document.getElementById('url-panel');
    urlDisclosure.addEventListener('click', () => {
      const open = urlPanel.classList.toggle('is-open');
      urlDisclosure.classList.toggle('is-open', open);
      urlDisclosure.setAttribute('aria-expanded', String(open));
    });

    let toastTimer;
    const showToast = (message) => {
      const toast = document.getElementById('toast');
      toast.querySelector('span').textContent = message;
      toast.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 1800);
    };
    document.getElementById('analyze-button').addEventListener('click', () => showToast(selectedScope === 'area' ? '已启动区域选择' : '正在分析完整页面'));
    document.getElementById('url-analyze').addEventListener('click', () => showToast('正在发送视频链接…'));
    document.getElementById('save-settings').addEventListener('click', () => {
      settingsView.classList.remove('is-open');
      settingsView.setAttribute('aria-hidden', 'true');
      showToast('设置已保存');
    });

    const prototypeParams = new URLSearchParams(location.search);
    if (prototypeParams.get('menu') === 'open') setAnalysisMenuOpen(true);
  </script>
</body>
</html>
